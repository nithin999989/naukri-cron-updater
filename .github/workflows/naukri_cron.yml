name: Naukri Profile Auto Updater

on:
  schedule:
    # 04:00 UTC is 09:30 AM IST
    - cron: '0 4 * * *'
    # 09:00 UTC is 02:30 PM IST (optional afternoon run)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows one-click manual run from GitHub Actions tab

jobs:
  update-naukri:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Naukri profile & resume updater
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_MOBILE: ${{ secrets.NAUKRI_MOBILE }}
          RESUME_NAME: "Nithin_SDE_Resume.pdf"
          HEADLESS: "True"
          UPDATE_PDF: "False"
          AUTO_DOWNLOAD_RESUME: "True"
        run: |
          python naukri.py
